<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dashboard.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <ul>
          <li><a href="#" id="dashboard-link">DASHBOARD</a></li>
          <li><a href="#" id="task-link">TASK</a></li>
        </ul>

        <ul>
          <li><a href="index.html">Logout</a></li>
        </ul>
      </aside>

      <main class="main-content">
        <header class="welcome">
          <h1>Welcome, User!</h1>
        </header>

        <section class="stats-container" id="stats-section">
          <div>Total Tasks</div>
          <div>Completed Tasks</div>
          <div>Pending Tasks</div>
        </section>

        <section class="task-section" id="task-section">
          <div class="task-section-header">
            <h1>My Tasks</h1>
            <p>Manage and track daily task</p>
          </div>
          <div class="task-container">
            <div class="task-container-header">
              <h1>Task List</h1>
              <button class="task-btn" id="task-button">Add Task</button>
            </div>
            <div class="task-card">
              <div class="card-container">
                <div>
                  <h1>Title</h1>
                  <p>Description</p>
                </div>
                <div>
                  <select name="status" id="task-status" class="status-option">
                    <option value="pending" selected>Pending</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
              </div>
              <div class="card-container">
                <div>
                  <h1>Title</h1>
                  <p>Description</p>
                </div>
                <div>
                  <select name="status" id="task-status" class="status-option">
                    <option value="pending" selected>Pending</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <section class="modal-overlay" id="modal-container">
        <div class="modal">
          <h1>New Task</h1>

          <form id="task-form">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="Enter task title"
            />

            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              name="description"
              placeholder="Enter task description"
            />

            <div class="modal-actions">
              <a href="#" class="cancel" id="cancel-modal">Cancel</a>
              <input type="submit" value="Save" class="save" id="save-modal" />
            </div>
          </form>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
